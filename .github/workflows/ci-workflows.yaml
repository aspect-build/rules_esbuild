name: CI - Aspect Workflows

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write

env:
    ASPECT_API_TOKEN: ${{ secrets.ASPECT_API_TOKEN }}
    # Pin the version of aspect-launcher to install to avoid GitHub API rate limiting from `latest` lookups in CI.
    INSTALL_ASPECT_LAUNCHER_VERSION: 2026.21.30

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    buildifier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                bazelisk-cache: true
                disk-cache: ${{ github.workflow }}-buildifier
                repository-cache: true
                external-cache: true
            - name: Buildifier
              run: |
                GITHUB_TOKEN=${{ github.token }} curl -fsSL https://install.aspect.build | bash -s -- "$INSTALL_ASPECT_LAUNCHER_VERSION"
                aspect buildifier --task-key=buildifier
    test:
        name: test (${{ matrix.workspace.path }}, ${{ matrix.bazel.id }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                workspace:
                - { path: ".", slug: "root" }
                - { path: "e2e/smoke", slug: "e2e-smoke" }
                - { path: "e2e/bundle", slug: "e2e-bundle" }
                - { path: "e2e/custom_version", slug: "e2e-custom_version" }
                - { path: "e2e/npm-links", slug: "e2e-npm-links" }
                - { path: "e2e/sourcemaps", slug: "e2e-sourcemaps" }
                - { path: "e2e/toolchain_from_source", slug: "e2e-toolchain_from_source" }
                - { path: "e2e/tsconfig", slug: "e2e-tsconfig" }
                bazel:
                - { id: "bazel-7", version: "7.x", flags: "--bazel-flag=--test_tag_filters=-skip-on-bazel7" }
                - { id: "bazel-8", version: "8.x", flags: "--bazel-flag=--test_tag_filters=-skip-on-bazel8" }
                - { id: "bazel-9", version: "9.x", flags: "--bazel-flag=--test_tag_filters=-skip-on-bazel9" }
        env:
            USE_BAZEL_VERSION: ${{ matrix.bazel.version }}
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                bazelisk-cache: true
                disk-cache: ${{ github.workflow }}-test-${{ matrix.workspace.slug }}-${{ matrix.bazel.id }}
                repository-cache: true
                external-cache: true
            - name: Test
              working-directory: ${{ matrix.workspace.path }}
              run: |
                GITHUB_TOKEN=${{ github.token }} curl -fsSL https://install.aspect.build | bash -s -- "$INSTALL_ASPECT_LAUNCHER_VERSION"
                aspect test --task-key=test-${{ matrix.workspace.slug }}-${{ matrix.bazel.id }} ${{ matrix.bazel.flags }} -- //...
