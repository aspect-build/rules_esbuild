name: CI - Aspect Workflows

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

env:
    # Indicates where the aspect CLI should look for .aspect/config.json
    ASPECT_WORKSPACE: ${{ github.workspace }}
    # Skip the --remote flag on fork PRs, which do not have access to secrets
    REMOTE_FLAG: ${{ secrets.ASPECT_OSS_API_TOKEN != '' && '--remote' || '' }}
    # The same, for the vanilla bazel calls in test.sh scripts
    BAZEL_ASPECT_FLAGS: ${{ secrets.ASPECT_OSS_API_TOKEN != '' && '--config=aspect-cloud' || '' }}

jobs:
    buildifier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@b1e9d142e86f63c10d603304daa22bf80492e24c # v2026.25.1
              with:
                aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
            - name: Buildifier
              run: aspect buildifier $REMOTE_FLAG --task:name=buildifier
    test:
        name: test (${{ matrix.workspace.path }}, ${{ matrix.bazel.id }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                workspace:
                - { path: ".", slug: "root" }
                - { path: "e2e/smoke", slug: "e2e-smoke" }
                - { path: "e2e/bundle", slug: "e2e-bundle" }
                - { path: "e2e/custom_version", slug: "e2e-custom_version" }
                - { path: "e2e/npm-links", slug: "e2e-npm-links" }
                - { path: "e2e/path_mapping", slug: "e2e-path_mapping" }
                - { path: "e2e/sourcemaps", slug: "e2e-sourcemaps" }
                - { path: "e2e/toolchain_from_source", slug: "e2e-toolchain_from_source" }
                - { path: "e2e/tsconfig", slug: "e2e-tsconfig" }
                bazel:
                - { id: "bazel-7", version: "7.x", flags: "--bazel-flag=--test_tag_filters=-skip-on-bazel7" }
                - { id: "bazel-8", version: "8.x", flags: "--bazel-flag=--test_tag_filters=-skip-on-bazel8" }
                - { id: "bazel-9", version: "9.x", flags: "--bazel-flag=--test_tag_filters=-skip-on-bazel9" }
        env:
            USE_BAZEL_VERSION: ${{ matrix.bazel.version }}
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@b1e9d142e86f63c10d603304daa22bf80492e24c # v2026.25.1
              with:
                aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
            - name: Test
              working-directory: ${{ matrix.workspace.path }}
              run: aspect test $REMOTE_FLAG --task:name=test-${{ matrix.workspace.slug }}-${{ matrix.bazel.id }} ${{ matrix.bazel.flags }} -- //...
            # test.sh shares the output base of the aspect test run above, whose remote
            # cache hits were never downloaded. It needs the same remote cache to fetch
            # them, or Bazel 7 fails with "Missing digest".
            - name: Optional ./test.sh
              working-directory: ${{ matrix.workspace.path }}
              run: |
                  if [[ -f ./test.sh ]]; then
                      # Bazel fails the build rather than create the directory the
                      # aspect-exec-log group writes into.
                      mkdir -p .aspect/generated
                      ./test.sh $BAZEL_ASPECT_FLAGS
                  else
                      echo "No test.sh in ${PWD}; skipping"
                  fi
