name: CI - Aspect Workflows

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write

env:
    ASPECT_API_TOKEN: ${{ secrets.ASPECT_API_TOKEN }}
    # Pin the version of aspect-launcher to install to avoid GitHub API rate limiting from `latest` lookups in CI.
    INSTALL_ASPECT_LAUNCHER_VERSION: 2026.21.30

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    buildifier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                bazelisk-cache: true
                disk-cache: ${{ github.workflow }}-buildifier
                repository-cache: true
                external-cache: true
            - name: Buildifier
              run: |
                GITHUB_TOKEN=${{ github.token }} curl -fsSL https://install.staging.aspect.build | bash -s -- "$INSTALL_ASPECT_LAUNCHER_VERSION"
                aspect buildifier --task-key=buildifier --formatter-target=//tools/format:buildifier
    test-bazel-7:
        runs-on: ubuntu-latest
        env:
            USE_BAZEL_VERSION: "7.x"
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                bazelisk-cache: true
                disk-cache: ${{ github.workflow }}-test-bazel-7
                repository-cache: true
                external-cache: true
            - name: Test (Bazel 7.x)
              run: |
                GITHUB_TOKEN=${{ github.token }} curl -fsSL https://install.staging.aspect.build | bash -s -- "$INSTALL_ASPECT_LAUNCHER_VERSION"
                aspect test --task-key=test-bazel-7 --bazel-flag=--test_tag_filters=-skip-on-bazel7 -- //...
    test-bazel-8:
        runs-on: ubuntu-latest
